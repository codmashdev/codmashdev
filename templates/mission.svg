<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="Our ninja way"><title>Our ninja way</title><desc>Codmash male anime lead and Naruto beside our services: expressive interfaces, custom software, and intelligent automation.</desc><defs><style>{{FONTS}}

text{font-family:'JBM',ui-monospace,Menlo,Consolas,monospace}
.sg{font-family:'SG','Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
.sgm{font-family:'SGM','Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}
.jb{font-family:'JBM',ui-monospace,Menlo,Consolas,monospace}
.jbb{font-family:'JBMB',ui-monospace,Menlo,Consolas,monospace;font-weight:700}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fu{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
.fi{animation:fadeIn .7s ease both}
.fl{animation:fadeL .7s cubic-bezier(.2,.8,.2,1) both}


.row{animation:fadeL .7s cubic-bezier(.2,.8,.2,1) both}
.art{animation:fadeIn 1s ease .15s both}
.float{animation:flt 7s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 13s linear infinite}

@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 .role{opacity:0!important}.role-primary{opacity:1!important}
 .chakra,.dust,.foil{display:none}
}
</style>
<linearGradient id="apanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171b28"/><stop offset="1" stop-color="#12151f"/></linearGradient><linearGradient id="aedge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2383f" stop-opacity=".55"/><stop offset=".5" stop-color="#272e42"/><stop offset="1" stop-color="#ff7a1a" stop-opacity=".5"/></linearGradient><pattern id="adots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r=".9" fill="#fff" fill-opacity=".05"/></pattern>
<linearGradient id="artF" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff"/><stop offset=".72" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
<mask id="am" maskUnits="userSpaceOnUse" x="32" y="36" width="520" height="446">
  <rect x="32" y="36" width="520" height="446" rx="18" fill="url(#artF)"/></mask>
<radialGradient id="warm"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".22"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
<filter id="b60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<filter id="gl2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1280" height="520" rx="24" fill="url(#apanel)"/><rect width="1280" height="520" rx="24" fill="url(#adots)"/><rect x=".75" y=".75" width="1278.5" height="518.5" rx="23.25" fill="none" stroke="url(#aedge)" stroke-width="1.5"/>
<circle cx="300" cy="300" r="240" fill="url(#warm)" filter="url(#b60)"/>

<g class="art"><g class="float" mask="url(#am)">
  <image x="32" y="36" width="520" height="446" href="{{ART_SQUAD}}" preserveAspectRatio="xMidYMid meet"/>
</g></g>

<g class="fu" style="animation-delay:.2s">
  <text class="jbb" x="600" y="68" font-size="12" fill="#ff7a1a" letter-spacing="2.1">// OUR NINJA WAY</text>
  <text class="sg" x="600" y="112" font-size="28" fill="#eef1f7" letter-spacing="-.4">Believe it &#8212; then ship it</text>
  <text class="sgm" x="600" y="142" font-size="15" fill="#8b93a7">Web, software and AI solutions for ambitious businesses.</text>
</g>
<g class="row" style="animation-delay:0.65s"><rect x="600" y="176" width="40" height="40" rx="12" fill="#ff7a1a" fill-opacity=".12" stroke="#ff7a1a" stroke-opacity=".35"/><g transform="translate(620,196)" fill="none" stroke="#ff7a1a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-8" width="18" height="16" rx="2.5"/><path d="M-9-3.5h18M-3.5-3.5V8"/></g><text class="sg" x="656" y="193" font-size="17" fill="#eef1f7">Interfaces that feel alive</text><text class="jb" x="656" y="212" font-size="12" fill="#8b93a7">Thoughtful web, mobile, eCommerce and UI/UX experiences.</text></g><g class="row" style="animation-delay:0.81s"><rect x="600" y="252" width="40" height="40" rx="12" fill="#4aa8ff" fill-opacity=".12" stroke="#4aa8ff" stroke-opacity=".35"/><g transform="translate(620,272)" fill="none" stroke="#4aa8ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M-9 5c3-9 6-9 9-4s6 5 9-4"/><circle cx="-9" cy="5" r="1.4" fill="currentColor"/></g><text class="sg" x="656" y="269" font-size="17" fill="#eef1f7">Software with a purpose</text><text class="jb" x="656" y="288" font-size="12" fill="#8b93a7">Custom platforms, portals and tools built around your business.</text></g><g class="row" style="animation-delay:0.97s"><rect x="600" y="328" width="40" height="40" rx="12" fill="#ffb52e" fill-opacity=".12" stroke="#ffb52e" stroke-opacity=".35"/><g transform="translate(620,348)" fill="none" stroke="#ffb52e" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-5.5" rx="8" ry="3"/><path d="M-8-5.5v11c0 1.7 3.6 3 8 3s8-1.3 8-3v-11M-8 0c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text class="sg" x="656" y="345" font-size="17" fill="#eef1f7">Automation that gives time back</text><text class="jb" x="656" y="364" font-size="12" fill="#8b93a7">AI assistants, connected APIs and workflows that do the work.</text></g>

<g class="fu" style="animation-delay:1.3s">
  <rect x="600" y="412" width="620" height="72" rx="16" fill="#ff7a1a" fill-opacity=".06" stroke="#ff7a1a" stroke-opacity=".3"/>
  <rect x="600" y="416" width="3.5" height="64" rx="1.75" fill="#ff7a1a"/>
  <text class="sgm" x="624" y="444" font-size="16" fill="#eef1f7">&#8220;Big ideas. Clean code. Real-world impact.&#8221;</text>
  <text class="jb" x="624" y="466" font-size="11" fill="#8b93a7" letter-spacing="1.3">CODMASH &#183; DESIGN &#183; DEVELOP &#183; AUTOMATE</text>
  <g transform="translate(1192,448)"><g class="spin"><g transform="scale(0.818)" opacity="0.8"><path d="M0-11 3.2-3.2 11 0 3.2 3.2 0 11-3.2 3.2-11 0-3.2-3.2Z" fill="none" stroke="#ff7a1a" stroke-width="1.8" stroke-linejoin="round"/><circle r="2" fill="none" stroke="#ff7a1a" stroke-width="1.5"/></g></g></g>
</g>
</svg>
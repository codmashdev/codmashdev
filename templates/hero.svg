<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="Codmash — Web, Software and AI Automation"><title>Codmash — Web, Software and AI Automation</title><desc>Codmash anime developer with a peace sign, animated terminal, rotating services, floating artwork and public GitHub statistics.</desc><defs><style>{{FONTS}}

text{font-family:'JBM',ui-monospace,Menlo,Consolas,monospace}
.sg{font-family:'SG','Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
.sgm{font-family:'SGM','Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}
.jb{font-family:'JBM',ui-monospace,Menlo,Consolas,monospace}
.jbb{font-family:'JBMB',ui-monospace,Menlo,Consolas,monospace;font-weight:700}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fu{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
.fi{animation:fadeIn .7s ease both}
.fl{animation:fadeL .7s cubic-bezier(.2,.8,.2,1) both}


.role{animation:role 13.2s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes role{0%{opacity:0;transform:translateY(14px)}3.5%{opacity:1;transform:translateY(0)}21%{opacity:1;transform:translateY(0)}24%{opacity:0;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-14px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
.spin2{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite reverse}
.chakra{animation:rise 5s ease-in-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}18%{opacity:.8}80%{opacity:.5}100%{transform:translateY(-120px);opacity:0}}
.glowpulse{animation:gp 3.4s ease-in-out infinite}
@keyframes gp{0%,100%{opacity:.35}50%{opacity:.75}}
.corner{stroke-dasharray:54;animation:draw .7s ease both}
@keyframes draw{from{stroke-dashoffset:54}to{stroke-dashoffset:0}}
.blink{animation:bl 1.1s step-end infinite}
@keyframes bl{0%,50%{opacity:1}50.01%,100%{opacity:0}}

@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 .role{opacity:0!important}.role-primary{opacity:1!important}
 .chakra,.dust,.foil{display:none}
}
.hero-float{animation:heroFloat 4.6s ease-in-out infinite;transform-origin:950px 440px}
@keyframes heroFloat{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-9px) rotate(.6deg)}}
</style>
<linearGradient id="hpanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171b28"/><stop offset="1" stop-color="#12151f"/></linearGradient><linearGradient id="hedge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".55"/><stop offset=".5" stop-color="#272e42"/><stop offset="1" stop-color="#4aa8ff" stop-opacity=".5"/></linearGradient><pattern id="hdots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r=".9" fill="#fff" fill-opacity=".05"/></pattern>
<linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0" stop-color="#ffb52e"/><stop offset=".5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff5c2b"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-.3 0;.3 0;-.3 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="barG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#4aa8ff"/></linearGradient>
<linearGradient id="vfadeL" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#000"/><stop offset=".22" stop-color="#fff"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="vfadeB" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff"/><stop offset=".82" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
<mask id="vmaskL" maskUnits="userSpaceOnUse" x="668" y="30" width="556" height="492">
  <rect x="668" y="30" width="556" height="492" fill="url(#vfadeL)"/></mask>
<mask id="vmaskB" maskUnits="userSpaceOnUse" x="668" y="30" width="556" height="492">
  <rect x="668" y="30" width="556" height="492" fill="url(#vfadeB)"/></mask>
<radialGradient id="chakraO"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".30"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
<radialGradient id="chakraB"><stop offset="0" stop-color="#4aa8ff" stop-opacity=".24"/><stop offset="1" stop-color="#4aa8ff" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur70" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<clipPath id="cardClip"><rect width="1280" height="560" rx="24"/></clipPath>
<clipPath id="hiClip"><rect x="52" y="118" width="300" height="34">
  <animate attributeName="width" values="0;0;300" keyTimes="0;.38;1" dur="1.3s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.3 0 .2 1"/></rect></clipPath>
<clipPath id="nameClip"><rect x="44" y="150" width="540" height="92">
  <animate attributeName="y" values="242;242;150" keyTimes="0;.52;1" dur="2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1"/></rect></clipPath>
<clipPath id="termClip"><rect x="52" y="52" width="430" height="24">
  <animate attributeName="width" values="0;430" keyTimes="0;1" dur=".9s" begin="0s" fill="freeze"/></rect></clipPath>
</defs>
<g clip-path="url(#cardClip)">
  <rect width="1280" height="560" fill="#0b0d13"/>
  <rect width="1280" height="560" fill="url(#hdots)"/>
  <g filter="url(#blur70)">
    <circle cx="200" cy="150" r="190" fill="url(#chakraO)"/>
    <circle cx="980" cy="430" r="230" fill="url(#chakraB)"/>
    <circle cx="640" cy="60" r="150" fill="url(#chakraO)" opacity=".6"/>
  </g>

  <!-- giant watermark emblem -->
  <g transform="translate(300,330)" opacity=".035"><g transform="scale(13.333)" opacity="1.0"><path d="M0-11.5c5 0 9.2 3.4 9.2 7.9 0 3.4-2.4 5.9-5.6 5.9-2.4 0-4.2-1.5-4.2-3.6 0-1.7 1.2-2.9 2.8-2.9 1.1 0 2 .7 2 1.8 0 .8-.5 1.4-1.2 1.6" fill="none" stroke="#ff7a1a" stroke-width="2.1" stroke-linecap="round"/><path d="M-9.2-3.6C-9.2 3.9-4.6 10 1.2 11.5" fill="none" stroke="#ff7a1a" stroke-width="2.1" stroke-linecap="round"/><path d="M0-11.5c-5.1 0-9.2 3.5-9.2 7.9" fill="none" stroke="#ff7a1a" stroke-width="2.1" stroke-linecap="round"/></g></g>

  <!-- Self-contained male anime lead; animation works inside a GitHub image. -->
  <g mask="url(#vmaskB)"><g class="hero-float">
    <image x="685" y="32" width="530" height="492" href="{{ART_NINJA}}" preserveAspectRatio="xMidYMid meet"/>
  </g></g>
  <!-- viewfinder -->
  <path class="corner" d="M702 84V54H732" fill="none" stroke="#ff7a1a" stroke-opacity=".85" stroke-width="2.4" stroke-linecap="round" style="animation-delay:0.35s"/><path class="corner" d="M1222 84V54H1192" fill="none" stroke="#ff7a1a" stroke-opacity=".85" stroke-width="2.4" stroke-linecap="round" style="animation-delay:0.43s"/><path class="corner" d="M702 444V474H732" fill="none" stroke="#ff7a1a" stroke-opacity=".85" stroke-width="2.4" stroke-linecap="round" style="animation-delay:0.51s"/><path class="corner" d="M1222 444V474H1192" fill="none" stroke="#ff7a1a" stroke-opacity=".85" stroke-width="2.4" stroke-linecap="round" style="animation-delay:0.59s"/>
  <g class="fi" style="animation-delay:.7s">
    <g transform="translate(728,452)"><g class="spin"><g transform="scale(0.773)" opacity="0.9"><path d="M0-11 3.2-3.2 11 0 3.2 3.2 0 11-3.2 3.2-11 0-3.2-3.2Z" fill="none" stroke="#ff7a1a" stroke-width="1.8" stroke-linejoin="round"/><circle r="2" fill="none" stroke="#ff7a1a" stroke-width="1.5"/></g></g></g>
    <text class="jbb" x="746" y="457" font-size="11.5" fill="#eef1f7" letter-spacing="2">CODMASH.DEV</text>
    <text class="jb" x="1208" y="457" font-size="10.5" fill="#8b93a7" text-anchor="end" letter-spacing="1.4">DESIGN &#183; BUILD &#183; SHIP</text>
    <rect x="724" y="470" width="484" height="3" rx="1.5" fill="#fff" fill-opacity=".1"/>
    <rect x="724" y="470" width="0" height="3" rx="1.5" fill="url(#barG)">
      <animate attributeName="width" values="0;484" dur="4.6s" repeatCount="indefinite"/></rect>
  </g>

  <!-- LEFT COLUMN -->
  <text clip-path="url(#termClip)" x="52" y="68" font-size="13">
    <tspan class="jbb" fill="#2fd48a">dev@codmash</tspan><tspan fill="#8b93a7">:~$ </tspan><tspan fill="#eef1f7">summon </tspan><tspan fill="#ff7a1a">--profile</tspan>
  </text>
  <rect class="blink" x="428" y="56" width="7" height="15" fill="#2fd48a"/>

  <text clip-path="url(#hiClip)" class="sgm" x="52" y="144" font-size="26" fill="#eef1f7">Hi, we're</text>
  <g clip-path="url(#nameClip)">
    <text class="sg" x="48" y="226" font-size="82" letter-spacing="-1" fill="url(#nameG)" filter="url(#glow)">Codmash</text>
  </g>
  <rect x="52" y="246" width="118" height="3.5" rx="1.75" fill="url(#barG)">
    <animate attributeName="width" values="0;0;118" keyTimes="0;.72;1" dur="2.6s" begin="0s" fill="freeze"/></rect>

  <g class="fi" style="animation-delay:1.9s"><g transform="translate(60,306)"><g transform="scale(0.833)" opacity="1.0"><path d="M0-11.5c5 0 9.2 3.4 9.2 7.9 0 3.4-2.4 5.9-5.6 5.9-2.4 0-4.2-1.5-4.2-3.6 0-1.7 1.2-2.9 2.8-2.9 1.1 0 2 .7 2 1.8 0 .8-.5 1.4-1.2 1.6" fill="none" stroke="#ff7a1a" stroke-width="2.1" stroke-linecap="round"/><path d="M-9.2-3.6C-9.2 3.9-4.6 10 1.2 11.5" fill="none" stroke="#ff7a1a" stroke-width="2.1" stroke-linecap="round"/><path d="M0-11.5c-5.1 0-9.2 3.5-9.2 7.9" fill="none" stroke="#ff7a1a" stroke-width="2.1" stroke-linecap="round"/></g></g></g>
  <text class="role role-primary jb" x="78" y="312" font-size="19" fill="#eef1f7" opacity="1" style="animation-delay:2.0s">Web &amp; Mobile Development</text><text class="role jb" x="78" y="312" font-size="19" fill="#eef1f7" opacity="0" style="animation-delay:5.3s">Custom Software &amp; Platforms</text><text class="role jb" x="78" y="312" font-size="19" fill="#eef1f7" opacity="0" style="animation-delay:8.6s">eCommerce &amp; UI/UX Design</text><text class="role jb" x="78" y="312" font-size="19" fill="#eef1f7" opacity="0" style="animation-delay:11.899999999999999s">AI &amp; Workflow Automation</text>

  <text class="sgm fu" x="52" y="356" font-size="16" fill="#8b93a7" style="animation-delay:2.6s">Turning ambitious ideas into powerful digital</text>
  <text class="sgm fu" x="52" y="378" font-size="16" fill="#8b93a7" style="animation-delay:2.7s">experiences &#8212; one great build at a time.</text>
  <g class="fu" style="animation-delay:3.0s"><rect x="56" y="398" width="118" height="54" rx="12" fill="#fff" fill-opacity=".03" stroke="#272e42"/><text class="sg" x="70" y="428" font-size="22" fill="#ff7a1a">{{REPOS}}</text><text class="jb" x="70" y="444" font-size="9" fill="#8b93a7" letter-spacing="1.6">REPOS</text></g><g class="fu" style="animation-delay:3.12s"><rect x="188" y="398" width="118" height="54" rx="12" fill="#fff" fill-opacity=".03" stroke="#272e42"/><text class="sg" x="202" y="428" font-size="22" fill="#ff7a1a">{{STARS}}</text><text class="jb" x="202" y="444" font-size="9" fill="#8b93a7" letter-spacing="1.6">STARS</text></g><g class="fu" style="animation-delay:3.24s"><rect x="320" y="398" width="118" height="54" rx="12" fill="#fff" fill-opacity=".03" stroke="#272e42"/><text class="sg" x="334" y="428" font-size="22" fill="#ff7a1a">{{FOLLOWERS}}</text><text class="jb" x="334" y="444" font-size="9" fill="#8b93a7" letter-spacing="1.6">FOLLOWERS</text></g>

  <g class="fu" style="animation-delay:3.5s">
    <rect x="452" y="398" width="138" height="54" rx="12" fill="#2fd48a" fill-opacity=".08" stroke="#2fd48a" stroke-opacity=".4"/>
    <circle cx="474" cy="418" r="4.5" fill="#2fd48a"><animate attributeName="opacity" values="1;.2;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <text class="jbb" x="486" y="422" font-size="9.5" fill="#2fd48a" letter-spacing="1.3">OPEN TO</text>
    <text class="jbb" x="486" y="440" font-size="9.5" fill="#2fd48a" letter-spacing="1.3">COLLAB</text>
  </g>

  <circle class="chakra" cx="120" cy="470" r="2.2" fill="#ff7a1a" opacity="0" style="animation-delay:0s;animation-duration:5s"/><circle class="chakra" cx="300" cy="500" r="1.6" fill="#ffb52e" opacity="0" style="animation-delay:1.2s;animation-duration:6s"/><circle class="chakra" cx="470" cy="450" r="1.9" fill="#ff7a1a" opacity="0" style="animation-delay:2.4s;animation-duration:5.5s"/><circle class="chakra" cx="210" cy="520" r="1.4" fill="#4aa8ff" opacity="0" style="animation-delay:0.6s;animation-duration:6.5s"/><circle class="chakra" cx="540" cy="505" r="1.7" fill="#ffb52e" opacity="0" style="animation-delay:3.1s;animation-duration:5.8s"/>
  <g transform="translate(1180,96)" opacity=".5"><g class="spin2"><g transform="scale(1.182)" opacity="0.9"><path d="M0-11 3.2-3.2 11 0 3.2 3.2 0 11-3.2 3.2-11 0-3.2-3.2Z" fill="none" stroke="#4aa8ff" stroke-width="1.8" stroke-linejoin="round"/><circle r="2" fill="none" stroke="#4aa8ff" stroke-width="1.5"/></g></g></g>
  <g transform="translate(56,500)" class="fi" style="animation-delay:3.8s">
    <text class="jb" x="0" y="0" font-size="10.5" fill="#8b93a7" letter-spacing="1.2">NIND&#332; &#183; </text>
    <text class="jb" x="76" y="0" font-size="10.5" fill="#ff7a1a" letter-spacing="1.2">Build boldly. Ship thoughtfully.</text>
  </g>
</g>
<rect x=".75" y=".75" width="1278.5" height="558.5" rx="23.25" fill="none" stroke="url(#hedge)" stroke-width="1.5"/>
</svg>
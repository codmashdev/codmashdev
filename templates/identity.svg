    <line x1="80" y1="448" x2="344" y2="448" stroke="#272e42"/>
    <text class="jb" x="80" y="466" font-size="8.8" fill="#8b93a7" letter-spacing="1.5">STUDIO</text><text class="sgm" x="80" y="481" font-size="12.5" fill="#eef1f7">codmash.com</text><text class="jb" x="222" y="466" font-size="8.8" fill="#8b93a7" letter-spacing="1.5">REACH</text><text class="sgm" x="222" y="481" font-size="12.5" fill="#eef1f7">Global</text><text class="jb" x="80" y="498" font-size="8.8" fill="#8b93a7" letter-spacing="1.5">FOCUS</text><text class="sgm" x="80" y="513" font-size="12.5" fill="#eef1f7">Web + Software</text><text class="jb" x="222" y="498" font-size="8.8" fill="#8b93a7" letter-spacing="1.5">MISSION</text><text class="sgm" x="222" y="513" font-size="12.5" fill="#eef1f7">Build &amp; Ship</text>

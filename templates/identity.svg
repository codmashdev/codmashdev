  <path d="M191 -46 L233 -46 L230 104 L194 104 Z" fill="url(#strapG)"/>
  <text class="jbb" font-size="8.6" fill="#f0e3c4" fill-opacity=".9" letter-spacing="2.3" transform="translate(216,-38) rotate(90)">CODMASH &#183; DEVELOPER &#183; CODMASH</text>
  <rect x="185" y="100" width="54" height="24" rx="6" fill="url(#metal)"/>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-label="Ninja registration card and mission dashboard"><title>Ninja registration card and mission dashboard</title><desc>Swinging Codmash studio ID and an automatically refreshed dashboard of public repositories, stars, forks, followers and contribution activity.</desc><defs><style>{{FONTS}}

text{font-family:'JBM',ui-monospace,Menlo,Consolas,monospace}
.sg{font-family:'SG','Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
.sgm{font-family:'SGM','Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}
.jb{font-family:'JBM',ui-monospace,Menlo,Consolas,monospace}
.jbb{font-family:'JBMB',ui-monospace,Menlo,Consolas,monospace;font-weight:700}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fu{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
.fi{animation:fadeIn .7s ease both}
.fl{animation:fadeL .7s cubic-bezier(.2,.8,.2,1) both}


.swing{transform-box:view-box;transform-origin:212px -40px;animation:drop 2.5s cubic-bezier(.3,1,.5,1) both, sway 6.4s ease-in-out 2.5s infinite}
@keyframes drop{0%{transform:translateY(-660px)}22%{transform:translateY(0) rotate(0deg)}42%{transform:rotate(3.2deg)}62%{transform:rotate(-2.1deg)}80%{transform:rotate(1.1deg)}100%{transform:rotate(0deg)}}
@keyframes sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
.foil{animation:foil 6.5s ease-in-out infinite}
@keyframes foil{0%{transform:translateX(-330px)}55%,100%{transform:translateX(370px)}}
.tile{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 11s linear infinite}

@media (prefers-reduced-motion:reduce){
 *{animation:none!important}
 .role{opacity:0!important}.role-primary{opacity:1!important}
 .chakra,.dust,.foil{display:none}
}
</style>
<linearGradient id="dpanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171b28"/><stop offset="1" stop-color="#12151f"/></linearGradient><linearGradient id="dedge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".55"/><stop offset=".5" stop-color="#272e42"/><stop offset="1" stop-color="#4aa8ff" stop-opacity=".5"/></linearGradient><pattern id="ddots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r=".9" fill="#fff" fill-opacity=".05"/></pattern>
<linearGradient id="strapG" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#8d1f26"/><stop offset=".5" stop-color="#e2383f"/><stop offset="1" stop-color="#8d1f26"/></linearGradient>
<linearGradient id="idbg" x1="0" y1="0" x2=".7" y2="1">
  <stop offset="0" stop-color="#1b2030"/><stop offset=".55" stop-color="#141824"/><stop offset="1" stop-color="#1d1710"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#e3e7ef"/><stop offset=".42" stop-color="#9aa1b2"/><stop offset=".56" stop-color="#6e7589"/><stop offset="1" stop-color="#b9c0cf"/></linearGradient>
<linearGradient id="foilG" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ff7a1a" stop-opacity="0"/><stop offset=".35" stop-color="#ff7a1a" stop-opacity=".14"/>
  <stop offset=".5" stop-color="#fff" stop-opacity=".2"/><stop offset=".65" stop-color="#4aa8ff" stop-opacity=".14"/>
  <stop offset="1" stop-color="#4aa8ff" stop-opacity="0"/></linearGradient>
<linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ffb52e"/><stop offset=".5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#e2383f"/></linearGradient>
<linearGradient id="mbar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ffb52e"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".6"/></filter>
<filter id="g2"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="idClip"><rect x="56" y="150" width="312" height="430" rx="20"/></clipPath>
<clipPath id="photoClip"><rect x="148" y="206" width="128" height="160" rx="14"/></clipPath>
</defs>
<rect width="1280" height="620" rx="24" fill="url(#dpanel)"/><rect width="1280" height="620" rx="24" fill="url(#ddots)"/><rect x=".75" y=".75" width="1278.5" height="618.5" rx="23.25" fill="none" stroke="url(#dedge)" stroke-width="1.5"/>
<g class="fu" style="animation-delay:.15s">
  <text class="jbb" x="420" y="54" font-size="12" fill="#ff7a1a" letter-spacing="2.1">// MISSION DASHBOARD</text>
  <text class="sg" x="420" y="96" font-size="28" fill="#eef1f7" letter-spacing="-.4">Stats from the field</text>
  <g transform="translate(1082,72)">
    <rect x="0" y="-19" width="158" height="28" rx="14" fill="#2fd48a" fill-opacity=".09" stroke="#2fd48a" stroke-opacity=".38"/>
    <circle cx="16" cy="-5" r="4" fill="#2fd48a"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text class="jbb" x="28" y="-1" font-size="9.6" fill="#2fd48a" letter-spacing="1.1">{{UPDATED}}</text>
  </g>
</g>
{{DASHBOARD}}

    <text class="jbb" x="96" y="172" font-size="10" fill="#ff7a1a" letter-spacing="1.9">CODMASH STUDIO ID</text>
    <text class="jb" x="350" y="172" font-size="10" fill="#8b93a7" text-anchor="end">No. 0001</text>

    <!-- photo -->
    <rect x="144" y="202" width="136" height="168" rx="18" fill="none" stroke="url(#ringG)" stroke-opacity=".8" stroke-width="2"/>
    <path id="ppath" d="M162 202H262Q280 202 280 220V352Q280 370 262 370H162Q144 370 144 352V220Q144 202 162 202Z" fill="none"/>
    <circle r="3.2" fill="#ffb52e"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#ppath"/></animateMotion></circle>
    <g clip-path="url(#photoClip)">
      <image x="148" y="206" width="128" height="160" href="{{ART_NINJA}}" preserveAspectRatio="xMidYMin slice"/>
    </g>
    <!-- rank stamp -->
    <g transform="translate(318,242)" opacity=".92">
      <circle r="26" fill="none" stroke="#e2383f" stroke-width="2" stroke-opacity=".8"/>
      <circle r="21" fill="#e2383f" fill-opacity=".1"/>
      <text class="jbb" y="-2" text-anchor="middle" font-size="12" fill="#e2383f" letter-spacing="1">RANK</text>
      <text class="sg" y="14" text-anchor="middle" font-size="15" fill="#e2383f">A</text>
    </g>
    <g transform="translate(102,242)"><g class="spin" opacity=".7"><g transform="scale(1.000)" opacity="0.9"><path d="M0-11 3.2-3.2 11 0 3.2 3.2 0 11-3.2 3.2-11 0-3.2-3.2Z" fill="none" stroke="#ffb52e" stroke-width="1.8" stroke-linejoin="round"/><circle r="2" fill="none" stroke="#ffb52e" stroke-width="1.5"/></g></g></g>

    <text class="sg" x="212.0" y="408" font-size="24" fill="#eef1f7" text-anchor="middle">Codmash</text>
